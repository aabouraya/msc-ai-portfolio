# Single source of truth for module metadata.
# Adding a module: add an entry here, then create modules/<slug>/ pages.
# status: in-progress | completed | not-started

- slug: intelligent-agents
  title: Intelligent Agents
  status: in-progress
  term: July 2026
  assessed: true
  summary: >-
    Agent architectures, multi-agent coordination and the design and
    implementation of an agent-based system, with attention to the legal,
    social, ethical and professional context.
  outcomes:
    - Identify and critically analyse agent-based systems, differentiating
      between architectures and approaches.
    - Apply and critically evaluate intelligent agent techniques to real-world
      problems, particularly where technical risk and uncertainty is involved.
    - Deploy critically appropriate software tools and skills for the design and
      implementation of an agent-based system, bearing in mind applicable legal,
      social, ethical, and professional issues.
    - Systematically develop and implement the skills required to be an effective
      member of a development team in a virtual professional environment,
      adopting real-life perspectives on team roles and organisation.
  skills:
    - Time management
    - Commercial awareness
    - Critical thinking and analysis
    - Communication and literacy skills
    - IT and digital
    - Resilience
    - Interpersonal
    - Problem-solving
    - Ethical awareness
    - Teamwork / global citizen and leadership
    - Critical reflection

